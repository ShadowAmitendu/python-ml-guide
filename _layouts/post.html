---
layout: default
---

<article class="post">
  <small style="color: #888;">{{ page.date | date: "%B %-d, %Y" }}</small>
  <h1 style="margin-top: 0.2em;">{{ page.title | escape }}</h1>

  <div class="post-content">
    {{ content }}
  </div>

  <p style="margin-top: 2.5em; border-top: 1px solid #333; padding-top: 1em;">
    <a href="{{ '/' | relative_url }}">&larr; Back to Home</a>
  </p>
</article>
